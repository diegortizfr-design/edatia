# ══════════════════════════════════════════════════════════════════════════════
# Edatia — Stack de PRUEBAS (staging) para Coolify
# Proyecto: matriz   Entorno: staging   Host: https://edatia.matriz.cloud
#
#   /            → SPA del ERP (web)
#   /api/v1/*    → API NestJS (api)   ← proxy interno, mismo origen = sin CORS
#   /uploads/*   → archivos subidos (api)
#
# Diferencias contra docker-compose.yml (producción con Traefik propio):
#   · sin red externa n8n_default  → Coolify crea la red del proyecto
#   · sin container_name fijos     → Coolify prefija por entorno
#   · sin labels de Traefik        → el dominio se asigna en Coolify al servicio web
#   · la BD NO publica 5432 al host (solo accesible dentro de la red)
#   · volúmenes propios *-staging  → jamás toca los datos de producción
#
# Variables requeridas (Coolify → Environment Variables): ver .env.staging.example
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL de pruebas ───────────────────────────────────────────────────
  db:
    image: postgres:15.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edatia_staging}
      POSTGRES_USER: ${DB_USER:-edatia}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data-staging:/var/lib/postgresql/data
    # Sin bind mounts a proposito: Coolify no deja el repo clonado en el host,
    # asi que Docker crearia un directorio vacio en lugar del archivo. La BD
    # adicional `herramientas_edatia` la crea `prisma db push` desde el api.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edatia} -d ${DB_NAME:-edatia_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Crea las bases antes de migrarlas ───────────────────────────────────────
  # La principal tambien: POSTGRES_DB solo crea una base en la primera
  # inicializacion del volumen, asi que cambiar DB_NAME despues no alcanza.
  # Y `migrate deploy`, a diferencia de `db push`, no crea la base si falta.
  # Va en un servicio aparte (la imagen de postgres trae createdb), idempotente
  # y sin bind mounts.
  db-init:
    image: postgres:15.6-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "createdb -h db -U ${DB_USER:-edatia} ${DB_NAME:-edatia_staging} 2>&1
      || echo '${DB_NAME:-edatia_staging}: ya existia';
      createdb -h db -U ${DB_USER:-edatia} herramientas_edatia 2>&1
      || echo 'herramientas_edatia: ya existia'"

  # ── Migraciones, en un one-shot con la misma imagen del api ─────────────────
  # Estaba dentro del arranque del api y lo dejaba colgado: el contenedor
  # quedaba `running` con el puerto 4000 cerrado, porque algo se trababa antes
  # de llegar a `node dist/main`.
  #
  # Dos cambios para que eso no vuelva a pasar:
  #  · se invoca el binario directo (/app/node_modules/.bin/prisma) en lugar de
  #    `npx prisma`. Si el binario no esta, esto falla en el acto; npx en cambio
  #    intenta bajarlo del registry y se queda esperando un "Ok to proceed?"
  #    que sin TTY nunca llega -- el cuelgue que estabamos viendo.
  #  · `exit 0` al final: un fallo de migracion no debe impedir que el api
  #    arranque. Si las tablas faltan se nota al primer request, y un api
  #    arriba se puede diagnosticar; uno que no arranca, no.
  api-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/${DB_NAME:-edatia_staging}?schema=public
      HERRAMIENTAS_DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/herramientas_edatia?schema=public
    # migrate deploy para el schema principal, que ya tiene una baseline capaz
    # de construir las 94 tablas desde cero (prisma/migrations/0_init). Antes
    # esto era un `db push` porque el historial solo creaba 6 tablas de 94; ver
    # PRODUCCION-BASELINE.md.
    #
    # herramientas.prisma sigue con db push: ese schema nunca tuvo migraciones.
    command: >
      sh -c "/app/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma;
             /app/node_modules/.bin/prisma db push --schema prisma/herramientas.prisma --skip-generate --accept-data-loss;
             exit 0"

  # ── Seeds, en un one-shot con la misma imagen del api ───────────────────────
  # Van como servicio y no a mano porque la API de Coolify no tiene endpoint de
  # ejecucion de comandos: no hay forma de hacer un `exec` en el contenedor.
  #
  # Correrlos en cada deploy es seguro: los dos seeds usan solo upsert (10 y 4
  # respectivamente, ningun create suelto), asi que son idempotentes.
  api-seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/${DB_NAME:-edatia_staging}?schema=public
      HERRAMIENTAS_DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/herramientas_edatia?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      MANAGER_ADMIN_PASSWORD: ${MANAGER_ADMIN_PASSWORD}
      PUBLIC_API_URL: https://${STAGING_HOST:-edatia.matriz.cloud}
    command:
      - sh
      - -c
      - |
        /app/node_modules/.bin/ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts
        /app/node_modules/.bin/ts-node --compiler-options '{"module":"CommonJS"}' prisma/manager-seed.ts
        exit 0

  # ── API NestJS ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    # En staging el schema se aplica solo en cada arranque.
    #  · schema.prisma     → tiene migraciones versionadas: migrate deploy
    #  · herramientas.prisma → no tiene carpeta de migraciones: db push.
    #    La base ya la creo el servicio db-init.
    #    --accept-data-loss evita que el contenedor se cuelgue pidiendo
    #    confirmación si hay drift. Es aceptable SOLO porque es staging.
    # Arranque con red de contencion para poder VER el error.
    # Responde 503 y no 200 a proposito: con 200 el healthcheck del contenedor
    # pasaria con el api muerto y Coolify lo reportaria sano. Con 503 el
    # healthcheck falla como debe y el cuerpo se sigue pudiendo leer con curl.
    # Si `node dist/main` arranca bien, escucha en 4000 y nada mas pasa: lo de
    # abajo no se ejecuta nunca. Si se cae, se captura su salida y se levanta un
    # servidor minimo en el 4000 que la sirve como texto. Asi el error viaja por
    # el proxy de web y se puede leer con un GET a /api/v1/health, que es el
    # unico canal disponible: la API de Coolify no expone los logs de este
    # contenedor y no tiene endpoint de ejecucion de comandos.
    command:
      - sh
      - -c
      - |
        node dist/main > /tmp/boot.log 2>&1
        echo '----- el proceso del api termino; salida capturada arriba -----' >> /tmp/boot.log
        node -e 'const h=require("http"),f=require("fs");h.createServer((q,s)=>{s.writeHead(503,{"Content-Type":"text/plain; charset=utf-8"});s.end(f.readFileSync("/tmp/boot.log","utf8"))}).listen(4000,()=>console.log("modo diagnostico en 4000"))'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/${DB_NAME:-edatia_staging}?schema=public
      HERRAMIENTAS_DATABASE_URL: postgresql://${DB_USER:-edatia}:${DB_PASSWORD}@db:5432/herramientas_edatia?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET}
      MANAGER_JWT_EXPIRES_IN: ${MANAGER_JWT_EXPIRES_IN:-8h}
      PUBLIC_API_URL: https://${STAGING_HOST:-edatia.matriz.cloud}
      # El SPA se sirve en el mismo host, así que CORS no hace falta;
      # se declara igual para clientes externos y para el manager.
      CORS_EXTRA_ORIGINS: https://${STAGING_HOST:-edatia.matriz.cloud},https://${MANAGER_STAGING_HOST:-manager.edatia.matriz.cloud}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      MANAGER_ADMIN_PASSWORD: ${MANAGER_ADMIN_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - uploads-data-staging:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── SPA del ERP + proxy al API ──────────────────────────────────────────────
  # Este es el servicio al que se le asigna el dominio en Coolify.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Mismo origen que el SPA → el navegador pega a /api/v1 sin CORS
        VITE_API_URL: https://${STAGING_HOST:-edatia.matriz.cloud}
        # Caddyfile con el proxy al api, horneado en la imagen
        CADDYFILE: Caddyfile.staging
    restart: unless-stopped
    # Sin condition: service_healthy. Se probo, y sirvio para confirmar que el
    # api no llegaba a healthy, pero deja todo el stack abajo (503 en el
    # dominio) cuando el api falla. En pruebas conviene lo contrario: que el
    # SPA se pueda ver aunque el backend este caido.
    depends_on:
      - api
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Portal Manager (opcional) ───────────────────────────────────────────────
  # Queda corriendo sin dominio; asignale MANAGER_STAGING_HOST en Coolify
  # cuando lo quieras público.
  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${MANAGER_STAGING_HOST:-manager.edatia.matriz.cloud}
        CADDYFILE: Caddyfile.staging
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  db-data-staging:
    driver: local
  uploads-data-staging:
    driver: local
