services:
  db:
    image: postgres:15.6-alpine
    container_name: edatia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-edatia_erp}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-edatia_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edatia-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-api.rule=Host(`api.edatia.com`)"
      - "traefik.http.routers.edatia-api.entrypoints=websecure"
      - "traefik.http.routers.edatia-api.tls=true"
      - "traefik.http.routers.edatia-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-api.loadbalancer.server.port=4000"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: edatia-landing
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-landing.rule=Host(`edatia.com`) || Host(`www.edatia.com`) || Host(`fundaciondlw.edatia.com`)"
      - "traefik.http.routers.edatia-landing.entrypoints=websecure"
      - "traefik.http.routers.edatia-landing.tls=true"
      - "traefik.http.routers.edatia-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-landing.loadbalancer.server.port=80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edatia-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-web.rule=Host(`erp.edatia.com`) || Host(`app.edatia.com`)"
      - "traefik.http.routers.edatia-web.entrypoints=websecure"
      - "traefik.http.routers.edatia-web.tls=true"
      - "traefik.http.routers.edatia-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-web.loadbalancer.server.port=80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    container_name: edatia-manager
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-manager.rule=Host(`manager.edatia.com`)"
      - "traefik.http.routers.edatia-manager.entrypoints=websecure"
      - "traefik.http.routers.edatia-manager.tls=true"
      - "traefik.http.routers.edatia-manager.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-manager.loadbalancer.server.port=80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  herramientas:
    build:
      context: ./herramientas
      dockerfile: Dockerfile
    container_name: edatia-herramientas
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-herramientas.rule=Host(`herramientas.edatia.com`)"
      - "traefik.http.routers.edatia-herramientas.entrypoints=websecure"
      - "traefik.http.routers.edatia-herramientas.tls=true"
      - "traefik.http.routers.edatia-herramientas.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-herramientas.loadbalancer.server.port=80"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  glowxir:
    build:
      context: ./tiendas-virtuales/glowxir
      dockerfile: Dockerfile
    container_name: edatia-glowxir
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-glowxir.rule=Host(`distribuidorababyworld.edatia.com`) || Host(`glowxir.edatia.com`)"
      - "traefik.http.routers.edatia-glowxir.entrypoints=websecure"
      - "traefik.http.routers.edatia-glowxir.tls=true"
      - "traefik.http.routers.edatia-glowxir.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-glowxir.loadbalancer.server.port=80"
    networks:
      - default

  prestamos:
    build:
      context: ./tiendas-virtuales/prestamos
      dockerfile: Dockerfile
    container_name: edatia-prestamos
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/prestamos_edatia?schema=public
      - JWT_SECRET=prestamos_secret_jwt_key_2026_PROD
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.edatia-prestamos.rule=Host(`prestamos.edatia.com`)"
      - "traefik.http.routers.edatia-prestamos.entrypoints=websecure"
      - "traefik.http.routers.edatia-prestamos.tls=true"
      - "traefik.http.routers.edatia-prestamos.tls.certresolver=letsencrypt"
      - "traefik.http.services.edatia-prestamos.loadbalancer.server.port=3000"
    networks:
      - default

networks:
  default:
    external: true
    name: n8n_default

volumes:
  db-data:
    driver: local
